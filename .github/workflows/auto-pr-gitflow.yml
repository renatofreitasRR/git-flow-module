name: Auto PR GitFlow

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create next release branch
        if: github.ref_name == 'develop'
        id: release
        shell: bash
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' || true

          LAST=$(git branch -r \
            | sed -n 's|.*origin/release/||p' \
            | sort -V \
            | tail -n 1)

          if [[ -z "$LAST" ]]; then
            NEXT="1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST"
            NEXT="$((MAJOR + 1)).0.0"
          fi

          BRANCH="release/$NEXT"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "Release branch $BRANCH already exists"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git fetch origin main
            git checkout -b "$BRANCH" origin/main
            git push origin "$BRANCH"
          fi

          echo "base=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Define target branch
        id: flow
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" =~ ^feature/ ]]; then
            echo "base=develop" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == "develop" ]]; then
            echo "base=${{ steps.release.outputs.base }}" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" =~ ^release/ ]]; then
            echo "base=main" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" =~ ^hotfix/ ]]; then
            echo "base=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.ref_name }}
          BASE: ${{ steps.flow.outputs.base }}
        shell: bash
        run: |
          if [[ -z "$BASE" ]]; then
            echo "No target branch defined"
            exit 0
          fi

          git fetch origin "$BASE" "$HEAD" || true

          if git diff --quiet "origin/$BASE...origin/$HEAD"; then
            echo "No commits between $BASE and $HEAD"
            exit 0
          fi

          EXISTS=$(gh pr list \
            --head "$HEAD" \
            --base "$BASE" \
            --state open \
            --json number \
            --jq 'length')

          if [[ "$EXISTS" != "0" ]]; then
            echo "PR already exists"
            exit 0
          fi

          gh pr create \
            --head "$HEAD" \
            --base "$BASE" \
            --title "Merge $HEAD into $BASE" \
            --body "Automatic GitFlow pull request."